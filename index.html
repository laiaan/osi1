<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYSTEM ACCESS</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b0b0b;
            color: #d4d4d4;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            padding: 20px;
        }
        .terminal {
            width: 100%;
            max-width: 450px;
            border: 1px solid #333;
            background-color: #111;
            padding: 25px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
        }
        .screen-header {
            color: #777;
            font-size: 0.85rem;
            margin-bottom: 20px;
            border-bottom: 1px solid #222;
            padding-bottom: 8px;
            letter-spacing: 1px;
        }
        .output {
            margin-bottom: 20px;
            line-height: 1.5;
            font-size: 0.95rem;
            white-space: pre-line;
        }
        .input-group {
            margin-top: 15px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: #a0a0a0;
        }
        input[type="password"], input[type="text"] {
            width: 100%;
            background-color: #050505;
            border: 1px solid #444;
            color: #fff;
            padding: 12px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.2rem;
            text-align: center;
            letter-spacing: 4px;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus {
            border-color: #888;
        }
        button {
            width: 100%;
            margin-top: 12px;
            background-color: #222;
            border: 1px solid #555;
            color: #fff;
            padding: 12px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #333;
        }
        .error {
            color: #ff6b6b;
            margin-top: 10px;
            font-size: 0.85rem;
            display: none;
        }
        .cursor {
            display: inline-block;
            width: 8px;
            height: 15px;
            background-color: #d4d4d4;
            animation: blink 1s infinite;
            vertical-align: middle;
            margin-left: 3px;
        }
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="terminal">
        <div class="screen-header">SYS_CORE // SECURE_GATEWAY_v2.2</div>
        
        <div id="game-container">
            <!-- PANTALLA D'ACCÉS -->
            <div id="login-screen">
                <div class="output">
                    SYSTEM ONLINE
                    AUTHENTICATION REQUIRED<span class="cursor"></span>
                </div>
                <div class="input-group">
                    <label for="access-code">ENTER ACCESS CODE:</label>
                    <input type="password" id="access-code" maxlength="4" placeholder="_ _ _ _">
                    <button id="login-btn">ACCedir</button>
                    <div id="error-msg" class="error">ACCÉS DENEGAT. Codi invàlid.</div>
                </div>
            </div>

            <!-- CONTENIDOR PER ALS NIVELLS (S'ACTIVARÀ MÉS ENDAVANT) -->
            <div id="level-screen" style="display: none;">
                <div class="output" id="level-output"></div>
            </div>
        </div>
    </div>

    <script>
        const correctCode = "2212";
        
        const loginScreen = document.getElementById("login-screen");
        const levelScreen = document.getElementById("level-screen");
        const levelOutput = document.getElementById("level-output");
        const codeInput = document.getElementById("access-code");
        const loginBtn = document.getElementById("login-btn");
        const errorMsg = document.getElementById("error-msg");

        function handleLogin() {
            const enteredCode = codeInput.value.trim();
            
            if (enteredCode === correctCode) {
                errorMsg.style.display = "none";
                loginScreen.style.display = "none";
                levelScreen.style.display = "block";
                
                // Animació d'entrada i missatge de benvinguda temporal
                levelOutput.innerHTML = "VERIFYING...<br>ACCESS GRANTED<br><br>WELCOME, OSI.";
                
                setTimeout(() => {
                    levelOutput.innerHTML += "<br><br>[ Carregant el Nivell 1... (Properament) ]";
                }, 2000);

            } else {
                errorMsg.style.display = "block";
                codeInput.value = "";
                codeInput.focus();
            }
        }

        loginBtn.addEventListener("click", handleLogin);
        
        codeInput.addEventListener("keypress", function(e) {
            if (e.key === "Enter") {
                handleLogin();
            }
        });

        // Posar el focus automàticament al camp quan s'obre la web
        window.onload = function() {
            codeInput.focus();
        };
    </script>
</body>
</html>
